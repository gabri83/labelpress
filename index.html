<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelPress</title>
<style>
  :root{
    --bg:#f4f4f5; --panel:#ffffff; --ink:#18181b; --muted:#71717a;
    --line:#e4e4e7; --accent:#2563eb; --accent-ink:#fff; --field:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#18181b; --panel:#27272a; --ink:#f4f4f5; --muted:#a1a1aa;
      --line:#3f3f46; --accent:#3b82f6; --field:#1f1f22; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:12.5px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 54px)}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{padding:20px;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;gap:16px}
  .stage{padding:28px;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;gap:20px;overflow:auto}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  select,input[type=number],input[type=text],textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--field);color:var(--ink);font-size:14px;font-family:inherit}
  textarea{min-height:150px;resize:vertical;line-height:1.45}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;background:var(--field);color:var(--ink);padding:8px;
    cursor:pointer;font-size:13px}
  .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
  .chk{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .hint code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:11.5px}
  .print-btn{margin-top:auto;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:9px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .print-btn:hover{filter:brightness(1.06)}
  .dims{color:var(--muted);font-size:12.5px;text-align:center}
  /* label surface — rendered at real mm, scaled up on screen only */
  .scaler{transform-origin:top left;margin:0 auto}
  .label{background:#fff;color:#000;box-shadow:0 0 0 1px #d4d4d8;overflow:hidden;
    display:flex;font-family:Arial,Helvetica,sans-serif}
  .label .inner{width:100%;display:flex;flex-direction:column}
  .label strong{font-weight:700}
  @media print{
    header,.panel,.stage>.dims,.scaler{all:unset}
    body{background:#fff}
    header,.panel,.dims{display:none!important}
    .wrap{display:block}
    .stage{padding:0;display:block}
    .scaler{transform:none!important;margin:0;width:auto!important;height:auto!important}
    .label{box-shadow:none!important;position:fixed;top:0;left:0}
  }
</style>
</head>
<body>
<header>
  <h1>LabelPress</h1>
  <span class="sub">Print to any DYMO LabelWriter through the system dialog — no DYMO software needed.</span>
</header>

<div class="wrap">
  <div class="panel">
    <div>
      <label class="f" for="roll">Label roll</label>
      <select id="roll"></select>
      <div class="row" id="customDims" style="margin-top:10px;display:none">
        <div><label class="f" for="cw">Width mm</label><input type="number" id="cw" value="89" min="10" step="0.5"></div>
        <div><label class="f" for="ch">Height mm</label><input type="number" id="ch" value="36" min="10" step="0.5"></div>
      </div>
      <div class="dims" id="dimLabel" style="text-align:left;margin-top:8px"></div>
    </div>

    <div>
      <label class="f" for="text">Text</label>
      <textarea id="text" spellcheck="false"></textarea>
      <div class="hint">Wrap words in <code>**double asterisks**</code> to bold them manually.</div>
    </div>

    <label class="chk"><input type="checkbox" id="allergen"> Auto-bold UK allergens (egg, soya, milk, wheat…)</label>

    <div class="row">
      <div>
        <label class="f" for="align">Align</label>
        <div class="seg" id="align">
          <button data-v="left" aria-pressed="true">Left</button>
          <button data-v="center" aria-pressed="false">Center</button>
          <button data-v="right" aria-pressed="false">Right</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label class="f" for="size">Font pt</label>
        <input type="number" id="size" value="7" min="4" max="48" step="0.5">
      </div>
      <div>
        <label class="f" for="margin">Margin mm</label>
        <input type="number" id="margin" value="1.5" min="0" max="10" step="0.5">
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="autofit" checked> Auto-fit: shrink font until it fits</label>

    <button class="print-btn" id="printBtn">Print / Save as PDF…</button>
  </div>

  <div class="stage">
    <div class="scaler"><div class="label" id="label"><div class="inner" id="inner"><div id="content"></div></div></div></div>
    <div class="dims" id="fitInfo"></div>
  </div>
</div>

<style id="pagesize"></style>
<script>
/* ---- roll presets: [name, widthMM(long edge), heightMM] ---- */
const ROLLS = [
  ["Address — 89 × 28 mm (99010 / 30252)", 89, 28],
  ["Large Address — 89 × 36 mm (99012 / 30321)", 89, 36],
  ["Name Badge — 89 × 41 mm (11356)", 89, 41],
  ["Multipurpose — 57 × 32 mm (11354 / 30334)", 57, 32],
  ["Shipping — 101 × 54 mm (99014)", 101, 54],
  ["Custom…", null, null],
];

/* ---- UK FSA 14 allergens (whole-word, case-insensitive) ---- */
const ALLERGENS = ["eggs?","milk","soya?","soybeans?","wheat","gluten","barley","rye",
  "oats?","spelt","kamut","peanuts?","almonds?","hazelnuts?","walnuts?","cashews?",
  "pecans?","pistachios?","macadamias?","brazil nuts?","fish","crustaceans?","prawns?",
  "crabs?","lobster","molluscs?","mussels?","oysters?","squid","celery","mustard",
  "sesame","lupin","sulphites?","sulphur dioxide","sulfites?"];
const ALLERGEN_RE = new RegExp("\\b("+ALLERGENS.join("|")+")\\b","gi");

const $ = id => document.getElementById(id);
const rollSel=$("roll"), text=$("text"), label=$("label"), inner=$("inner"), content=$("content");
let align="left";

ROLLS.forEach((r,i)=>{const o=document.createElement("option");o.value=i;o.textContent=r[0];rollSel.appendChild(o);});
rollSel.value=1; // default 89×36

const DEFAULT_TEXT =
"Consulate General of Italy\nPassport Office\n83-86 Farringdon St.\nEC4A 4BL – London";
text.value = DEFAULT_TEXT;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderText(raw){
  const auto = $("allergen").checked;
  const lines = raw.split("\n");
  return lines.map(line=>{
    // manual **bold** → split on ** toggling
    const parts = line.split("**");
    const html = parts.map((p,i)=>{
      let seg = esc(p);
      if(auto) seg = seg.replace(ALLERGEN_RE, "<strong>$1</strong>");
      return (i%2===1) ? "<strong>"+seg+"</strong>" : seg;
    }).join("");
    return html==="" ? "&nbsp;" : html;
  }).join("<br>");
}

function currentRoll(){
  const r = ROLLS[+rollSel.value];
  if(r[1]===null) return [parseFloat($("cw").value)||89, parseFloat($("ch").value)||36];
  return [r[1], r[2]];
}

function fits(){ return inner.scrollHeight <= label.clientHeight + 0.5; }

function draw(){
  const [W,H] = currentRoll();
  const m = parseFloat($("margin").value)||0;
  label.style.width = W+"mm";
  label.style.height = H+"mm";
  label.style.padding = m+"mm";
  inner.style.textAlign = align;
  inner.style.justifyContent = "center"; // vertical centering
  content.innerHTML = renderText(text.value);
  $("pagesize").textContent = "@page{size:"+W+"mm "+H+"mm;margin:0}";
  $("dimLabel").textContent = W+" × "+H+" mm";

  // font sizing
  let pt = parseFloat($("size").value)||7;
  const applyPt = p => { inner.style.fontSize=p+"pt"; inner.style.lineHeight="1.2"; };
  applyPt(pt);
  if($("autofit").checked){
    let p = pt;
    while(!fits() && p>3){ p-=0.5; applyPt(p); }
    $("fitInfo").textContent = p<pt ? ("Shrunk to "+p+" pt to fit.")
      : (fits()? "Fits at "+p+" pt." : "");
    $("size").value = p;
  } else {
    $("fitInfo").textContent = fits() ? "Fits at "+pt+" pt."
      : "⚠ Overflows at "+pt+" pt — enable Auto-fit or lower the size.";
  }

  // scale the preview to fit the stage (screen only; print uses real mm)
  const scaler = document.querySelector(".scaler");
  const stageW = document.querySelector(".stage").clientWidth - 56;
  const lw = label.offsetWidth, lh = label.offsetHeight;
  const sc = Math.max(1.5, Math.min(4, stageW/lw));
  scaler.style.transform = "scale("+sc+")";
  scaler.style.width = (lw*sc)+"px";
  scaler.style.height = (lh*sc)+"px";
}
window.addEventListener("resize",draw);

// events
[rollSel,text,$("allergen"),$("size"),$("margin"),$("autofit"),$("cw"),$("ch")]
  .forEach(el=>el.addEventListener("input",()=>{
    $("customDims").style.display = ROLLS[+rollSel.value][1]===null ? "flex":"none";
    draw();
  }));
document.querySelectorAll("#align button").forEach(b=>b.addEventListener("click",()=>{
  align=b.dataset.v;
  document.querySelectorAll("#align button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  draw();
}));
$("printBtn").addEventListener("click",()=>{draw();window.print();});

// restore last settings (optional, degrades gracefully)
try{
  const s=JSON.parse(localStorage.getItem("labelpress")||"{}");
  if(s.roll!=null)rollSel.value=s.roll;
  if(s.text!=null)text.value=s.text;
  if(s.size!=null)$("size").value=s.size;
  if(s.margin!=null)$("margin").value=s.margin;
  if(s.allergen!=null)$("allergen").checked=s.allergen;
  if(s.autofit!=null)$("autofit").checked=s.autofit;
  if(s.align!=null){align=s.align;
    document.querySelectorAll("#align button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===align));}
}catch(e){}
window.addEventListener("beforeunload",()=>{try{
  localStorage.setItem("labelpress",JSON.stringify({roll:rollSel.value,text:text.value,
    size:$("size").value,margin:$("margin").value,allergen:$("allergen").checked,
    autofit:$("autofit").checked,align}));}catch(e){}});

$("customDims").style.display = ROLLS[+rollSel.value][1]===null ? "flex":"none";
draw();
</script>
</body>
</html>
